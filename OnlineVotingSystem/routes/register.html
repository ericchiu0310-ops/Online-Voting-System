<html>
    <head>
        <title>HKMU Online Vocating System - Registration</title>
        <link rel="stylesheet" href="../css/stylesheet.css">
    </head>
    <body>

        <style>
            #imagepart{
                border: 2px solid black;
                border-radius: 5px;
                padding: 10px;
                width:20%;

            }

            #role{
                border: 2px solid black;
                border-radius: 5px;
                padding: 10px;
                width: 20%;

            }

            #role select{
                border-radius: 5px;
                padding: 10px;
            }

        </style> 

        <center>
        <div id="headerSection">
            <h1>HKMU Online Vocating System</h1>
        </div>
        <hr>

        <div id="bodySection">
            <h3>Registration</h3>
            <form action="../api/register.php" method="POST" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Enter name">
                <input type="number" name="studentid" placeholder="Enter student id"><br><br>
                <input type="password" name="password" placeholder="Password">
                <input type="password" name="cpassword" placeholder="Confirmed Password"><br><br>

                <div id="imagepart">
                    Upload image: <input type="file" name="photo">
                </div>
                <br>
                <div id="role">
                    Select Your Role: <select name="role">
                        <option value="1">Voter</option>
                        <option value="2">Group</option>
                    </select>
                 </div>
                <br>   
                <button
                    style="padding: 5px;
                            border-radius: 5px;
                            background-color:E67E22;
                            color: white;
                            border-radius: 5px;">
                Register</button><br><br>
                Already user? <a href="../">Login here</a>
            
            </form>
        </div>
    </center>
    </body>
    </html>
